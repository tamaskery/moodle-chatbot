name: Feature request
description: Suggest a Course AI Guide improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security, privacy and compatibility considerations
      description: Explain any new data, provider, permission or Moodle API requirements.
    validations:
      required: true
