name: Moodle Plugin CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moodle-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Moodle 4.5 / PHP 8.1 / PostgreSQL
            moodle-branch: MOODLE_405_STABLE
            php: "8.1"
            database: pgsql
          - name: Moodle 4.5 / PHP 8.3 / MySQL
            moodle-branch: MOODLE_405_STABLE
            php: "8.3"
            database: mysqli
          - name: Moodle 5.0 / PHP 8.2 / PostgreSQL
            moodle-branch: MOODLE_500_STABLE
            php: "8.2"
            database: pgsql
          - name: Moodle 5.1 / PHP 8.2 / PostgreSQL
            moodle-branch: MOODLE_501_STABLE
            php: "8.2"
            database: pgsql
          - name: Moodle 5.2 / PHP 8.3 / PostgreSQL
            moodle-branch: MOODLE_502_STABLE
            php: "8.3"
            database: pgsql
          - name: Moodle 5.2 / PHP 8.4 / MySQL
            moodle-branch: MOODLE_502_STABLE
            php: "8.4"
            database: mysqli

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle and plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validate plugin
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: JavaScript and CSS validation
        if: ${{ !cancelled() }}
        run: |
          moodle-plugin-ci grunt --tasks=gherkinlint --tasks=stylelint --max-lint-warnings 0
          if [ -d "$GITHUB_WORKSPACE/moodle/public/blocks/courseaiguide" ]; then
            pluginroot="public/blocks/courseaiguide"
          else
            pluginroot="blocks/courseaiguide"
          fi
          cd "$GITHUB_WORKSPACE/moodle"
          npx grunt eslint:amd --root="$pluginroot" --max-lint-warnings=0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat scenarios
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations

      - name: Upload Behat failure evidence
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: behat-faildump-${{ matrix.moodle-branch }}-php${{ matrix.php }}-${{ matrix.database }}
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1
