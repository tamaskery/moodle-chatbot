name: Publish release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Build Moodle-compatible ZIP
        shell: bash
        run: |
          archive="block_courseaiguide-${GITHUB_REF_NAME}.zip"
          git archive --format=zip --prefix=courseaiguide/ --output="$archive" HEAD
          unzip -Z1 "$archive" | awk 'index($0, "courseaiguide/") != 1 { exit 1 }'
          sha256sum "$archive" > "$archive.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive="block_courseaiguide-${GITHUB_REF_NAME}.zip"
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$archive#Moodle plugin package" \
            "$archive.sha256#SHA-256 checksum" \
            --verify-tag \
            --generate-notes \
            "${flags[@]}"
